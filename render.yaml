# path: render.yaml
services:
  - type: web
    name: snhu-map
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    # modern replacement for pullRequestPreviewsEnabled: true
    previews:
      generation: automatic

    # helps the builder pick the right Node
    envVars:
      - key: NODE_VERSION
        value: "22"
